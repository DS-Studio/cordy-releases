name: "Bug report: Cordy Desktop"
description: Report a problem with a published Cordy Desktop build.
title: "[Desktop] "
labels:
  - bug
  - "product: desktop"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Product source code is not hosted in this repository.** This tracker
        is for issues with the **published Cordy Desktop builds** (installers,
        checksums, release notes) — not for source-level bug reports.

  - type: markdown
    attributes:
      value: |
        **Before you file:** Windows installers are not code-signed, and the
        macOS build is not notarized. If what you're seeing is an OS security
        warning (SmartScreen, Gatekeeper, "unidentified developer", etc.),
        that is expected behavior, not a bug. See
        [Installing on Windows](../../docs/install-windows.md) and
        [Installing on macOS](../../docs/install-macos.md) first.

  - type: input
    id: version
    attributes:
      label: Cordy Desktop version
      description: The version you installed, exactly as shown in the app or the release tag.
      placeholder: "0.5.3"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Operating system and architecture
      options:
        - Windows x64
        - macOS Apple Silicon
        - Linux x64
        - Linux arm64
        - "Other (unsupported)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that lead to the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This report does not contain any secrets, API keys, tokens, or personal data.
          required: true
