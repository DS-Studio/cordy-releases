name: "Bug report: Cordy for Chrome"
description: Report a problem with a published Cordy for Chrome build.
title: "[Chrome] "
labels:
  - bug
  - "product: chrome"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Product source code is not hosted in this repository.** This tracker
        is for issues with the **published Cordy for Chrome builds** — not for
        source-level bug reports.

  - type: markdown
    attributes:
      value: |
        **Before you file:** the `.zip` attached to a release is a
        verification artifact for auditing the reviewed package — it is not
        an alternate install path. The supported way to install this
        extension is the **Chrome Web Store**.

  - type: input
    id: version
    attributes:
      label: Cordy for Chrome version
      description: The version shown on the extension's details page, or the release tag.
      placeholder: "2.5.4"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and version
      description: The browser and its version number.
      placeholder: "Chrome 128.0.6613.84"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that lead to the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This report does not contain any secrets, API keys, tokens, or personal data.
          required: true
